name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_ENV: test

jobs:
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend/core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/backend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run backend unit tests
        run: npm run test:unit
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test-key
          SUPABASE_ANON_KEY: test-key
          NOTION_TOKEN: test-token
          XERO_CLIENT_ID: test-client-id
          XERO_CLIENT_SECRET: test-client-secret
          SENDGRID_API_KEY: test-key
          TWILIO_ACCOUNT_SID: test-sid
          TWILIO_AUTH_TOKEN: test-token

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/backend/core/coverage/lcov.info
          fail_ci_if_error: false

  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    defaults:
      run:
        working-directory: apps/backend/core

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup database
        run: |
          # Run migrations
          npx supabase db start || true

      - name: Run integration tests
        run: npm run test:integration
        env:
          SUPABASE_URL: http://localhost:54321
          SUPABASE_SERVICE_ROLE_KEY: test-key
          SUPABASE_ANON_KEY: test-key
          REDIS_URL: redis://localhost:6379
          NOTION_TOKEN: test-token
          XERO_CLIENT_ID: test-client-id
          XERO_CLIENT_SECRET: test-client-secret
          SENDGRID_API_KEY: test-key
          TWILIO_ACCOUNT_SID: test-sid
          TWILIO_AUTH_TOKEN: test-token

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run frontend type check
        run: npm run typecheck

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: ./apps/frontend/coverage/lcov.info
          fail_ci_if_error: false

  frontend-e2e-tests:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-tests]
    if: github.event_name == 'pull_request'

    defaults:
      run:
        working-directory: apps/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        run: npm run build

      - name: Start preview server
        run: npm run preview &
        shell: bash

      - name: Wait for server
        run: sleep 5

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:4173

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run backend lint
        working-directory: apps/backend/core
        run: npm run lint || true

      - name: Run frontend lint
        working-directory: apps/frontend
        run: npm run lint

  coverage-check:
    name: Coverage Check
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, frontend-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check coverage thresholds
        run: |
          # Backend coverage check
          if [ -f apps/backend/core/coverage/coverage-summary.json ]; then
            BACKEND_COVERAGE=$(cat apps/backend/core/coverage/coverage-summary.json | jq '.total.lines.pct')
            echo "Backend coverage: $BACKEND_COVERAGE%"
            if (( $(echo "$BACKEND_COVERAGE < 80" | bc -l) )); then
              echo "Backend coverage below 80%"
              exit 1
            fi
          fi

          # Frontend coverage check
          if [ -f apps/frontend/coverage/coverage-summary.json ]; then
            FRONTEND_COVERAGE=$(cat apps/frontend/coverage/coverage-summary.json | jq '.total.lines.pct')
            echo "Frontend coverage: $FRONTEND_COVERAGE%"
            if (( $(echo "$FRONTEND_COVERAGE < 80" | bc -l) )); then
              echo "Frontend coverage below 80%"
              exit 1
            fi
          fi

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-unit-tests, backend-integration-tests, frontend-tests, lint, coverage-check]
    if: always()

    steps:
      - name: Print test results
        run: |
          echo "Backend Unit Tests: ${{ needs.backend-unit-tests.result }}"
          echo "Backend Integration Tests: ${{ needs.backend-integration-tests.result }}"
          echo "Frontend Tests: ${{ needs.frontend-tests.result }}"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Coverage Check: ${{ needs.coverage-check.result }}"
